<!DOCTYPE html>
<html>
<head>
  <title>My first three.js app</title>
  <style>
  body { 
    margin: 0; 
    background-color: #282C34;
    font-family: Arial, sans-serif; 
    color: #FFF; 
  }

  #info {
    position: absolute;
    top: 10px;
    left: 10px;
    padding: 15px; 
    color: #A40808;
    background-color: #1D1D24; 
    border-radius: 10px; 
    font-size: 1.1em;
    z-index: 1;
    border: 2px dashed #A40808;
  }

  #reset-button {
    position: fixed;
    top: 15px;
    right: 15px;
    padding: 10px 15px;
    color: #FFF;
    background: #2196F3;
    border: 2px solid #A40808;
    border-radius: 8px;
    font-size: 1em;
    cursor: pointer;
    z-index: 1;
  }

  #reset-button:disabled {
    cursor: wait;
    opacity: 0.6;
  }

  #bomb-button {
    position: fixed;
    top: 235px;
    right: 15px;
    padding: 10px 15px;
    color: #FFF;
    background: #A40808;
    border: 2px solid #A40808;
    border-radius: 8px;
    font-size: 1em;
    cursor: pointer;
    z-index: 1;
  }

  #bomb-button:disabled {
    cursor: wait;
    opacity: 0.6;
  }

  .camera-button {
    position: fixed;
    right: 15px;
    padding: 10px 15px;
    color: #FFF;
    background: #1D1D24;
    border: 2px solid #A40808;
    border-radius: 8px;
    font-size: 1em;
    cursor: pointer;
    z-index: 1;
  }

  .camera-button[aria-pressed="true"] {
    background: #A40808;
  }

  #drone-camera-button {
    top: 70px;
  }

  #bottom-camera-button {
    top: 180px;
  }

  #camera-move-button {
    top: 125px;
  }

  #control-panel {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: space-around;
    gap: 50px;
  }

  .panel {
    padding: 10px;
    background: rgba(29, 29, 36, 0.8);
    border-radius: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #A40808;
  }

  .joystick-container {
    width: 150px;
    height: 150px;
    background: rgba(11, 10, 10, 0.1);
    border-radius: 75px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: grab;
    touch-action: none;
    user-select: none;
  }

  .joystick-container:active {
    cursor: grabbing;
  }

  .joystick {
    position: absolute;
    width: 50px;
    height: 50px;
    background: #A40808;
    border-radius: 25px;
    pointer-events: none;
  }

  /* Crosshair styles */
  .joystick-container::before, .joystick-container::after {
    content: "";
    position: absolute;
    background: #A40808;
  }

  .joystick-container::before {
    width: 2px;
    height: 100%;
    
  }

  .joystick-container::after {
    width: 100%;
    height: 2px;
  }
  </style>
</head>
<body>
  <div id="info">
    <p id="speed">Speed: 0</p>
    <p id="position">Position: (0, 0, 0)</p>
  </div>

  <button id="reset-button" type="button" disabled>출발지점으로 재시작(E)</button>
  <button id="drone-camera-button" class="camera-button" type="button" aria-pressed="false">1인칭시점 카메라 (C)</button>
  <button id="camera-move-button" class="camera-button" type="button" aria-pressed="false">카메라 이동 (V)</button>
  <button id="bottom-camera-button" class="camera-button" type="button" aria-pressed="false">하부 카메라 (M)</button>
  <button id="bomb-button" type="button" disabled>폭탄 투하(B)</button>

  <div id="control-panel">
    <div id="joystick-container-vertical" class="panel joystick-container">
      <div id="joystick-vertical" class="joystick"></div>
    </div>
    <div id="joystick-container-horizontal" class="panel joystick-container">
      <div id="joystick-horizontal" class="joystick"></div>
    </div>
  </div>

  <script src="https://threejs.org/build/three.js"></script>
  <script type="module" src="drone.js"></script>

  <script>
  </script>
</body>
</html>
